<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - PPI Aachen</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Decap CMS JavaScript -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Load styles into Decap CMS preview iframe
    CMS.registerPreviewStyle("/css/styles.css");
    CMS.registerPreviewStyle("https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css");

    const h = React.createElement;

    // Helper to format text with line breaks
    function renderText(text) {
      if (!text) return null;
      const lines = String(text).split('\n\n');
      return lines.map((line, idx) => h('p', { key: idx, className: 'mb-4 text-gray-700 leading-relaxed' }, line));
    }

    // Helper to resolve asset URL
    function getImageUrl(getAsset, image) {
      if (!image) return null;
      try {
        const asset = getAsset(image);
        return asset ? asset.toString() : image;
      } catch (e) {
        return image;
      }
    }

    function renderSection(section, index, getAsset) {
      const key = index;
      const type = section.type;

      switch (type) {
        case 'Hero':
          return h('div', { key, className: 'bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-8 md:p-12 rounded-2xl shadow-lg text-center mb-6' },
            h('h2', { className: 'text-3xl md:text-4xl font-extrabold mb-3 tracking-tight' }, section.title),
            section.subtitle && h('p', { className: 'text-blue-100 text-lg md:text-xl font-light max-w-2xl mx-auto' }, section.subtitle)
          );

        case 'Section': {
          const bgMap = {
            white: 'bg-white border-gray-200',
            blue: 'bg-blue-50/70 border-blue-200',
            gray: 'bg-slate-100 border-slate-200'
          };
          const bgClass = bgMap[section.backgroundColor] || 'bg-white border-gray-200';
          const imgUrl = getImageUrl(getAsset, section.image);
          const isLeft = section.imagePosition === 'left';
          const isCenter = section.imagePosition === 'center';

          return h('div', { key, className: `${bgClass} border p-6 md:p-8 rounded-2xl shadow-sm space-y-4 mb-6` },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900 border-b pb-2' }, section.title),
            imgUrl && isCenter && h('div', { className: 'my-4 text-center' },
              h('img', { src: imgUrl, className: 'max-h-80 mx-auto rounded-xl shadow-md object-cover' }),
              section.imageCaption && h('p', { className: 'text-xs text-gray-500 italic mt-2' }, section.imageCaption)
            ),
            h('div', { className: imgUrl && !isCenter ? (isLeft ? 'md:flex md:flex-row-reverse gap-6 items-start' : 'md:flex md:flex-row gap-6 items-start') : '' },
              h('div', { className: 'flex-1 space-y-2' },
                renderText(section.content || section.content_id || section.content_en)
              ),
              imgUrl && !isCenter && h('div', { className: 'w-full md:w-1/3 mt-4 md:mt-0 flex-shrink-0' },
                h('img', { src: imgUrl, className: 'w-full rounded-xl shadow-md object-cover max-h-60' }),
                section.imageCaption && h('p', { className: 'text-xs text-gray-500 italic mt-2 text-center' }, section.imageCaption)
              )
            )
          );
        }

        case 'EventGrid': {
          const events = section.events || [];
          return h('div', { key, className: 'space-y-6 mb-6' },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900' }, section.title),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
              events.map((ev, i) => {
                const evImg = getImageUrl(getAsset, ev.image);
                return h('div', { key: i, className: 'bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm flex flex-col' },
                  evImg && h('img', { src: evImg, className: 'h-48 w-full object-cover' }),
                  h('div', { className: 'p-5 flex-1 flex flex-col justify-between space-y-3' },
                    h('div', null,
                      ev.tag && h('span', { className: 'inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full mb-2' }, ev.tag),
                      h('h4', { className: 'text-lg font-bold text-gray-900' }, ev.title),
                      h('div', { className: 'text-xs text-gray-500 space-y-1 mt-1' },
                        ev.date && h('div', null, '📅 ', ev.date, ev.time ? ` • ${ev.time}` : ''),
                        ev.location && h('div', null, '📍 ', ev.location)
                      ),
                      ev.description && h('p', { className: 'text-sm text-gray-600 mt-2 line-clamp-3' }, ev.description)
                    ),
                    ev.link && h('a', { href: ev.link, target: '_blank', className: 'inline-block text-xs font-semibold text-blue-600 hover:underline mt-2' }, ev.linkText || 'Learn More →')
                  )
                );
              })
            )
          );
        }

        case 'ExecutiveBoard': {
          return h('div', { key, className: 'bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 p-6 md:p-8 rounded-2xl shadow-sm space-y-4 mb-6' },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900' }, section.title),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 mt-4' },
              section.chair && h('div', { className: 'bg-white p-4 rounded-xl border border-blue-100 shadow-xs' },
                h('div', { className: 'text-xs text-blue-600 font-bold uppercase tracking-wider' }, 'Ketua / Chair'),
                h('div', { className: 'text-lg font-bold text-gray-900 mt-1' }, section.chair)
              ),
              section.vice && h('div', { className: 'bg-white p-4 rounded-xl border border-blue-100 shadow-xs' },
                h('div', { className: 'text-xs text-blue-600 font-bold uppercase tracking-wider' }, 'Wakil Ketua / Vice Chair'),
                h('div', { className: 'text-lg font-bold text-gray-900 mt-1' }, section.vice)
              )
            )
          );
        }

        case 'DepartmentList': {
          const depts = section.departments || [];
          return h('div', { key, className: 'space-y-6 mb-6' },
            h('h3', { className: 'text-2xl font-bold text-gray-900' }, 'Departments'),
            h('div', { className: 'grid grid-cols-1 gap-4' },
              depts.map((dept, i) => h('div', { key: i, className: 'bg-white border border-gray-200 p-6 rounded-2xl shadow-sm space-y-3' },
                h('h4', { className: 'text-xl font-bold text-gray-900' }, dept.name),
                dept.description && renderText(dept.description),
                dept.members && dept.members.length > 0 && h('div', { className: 'pt-2' },
                  h('div', { className: 'text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2' }, 'Members'),
                  h('div', { className: 'flex flex-wrap gap-2' },
                    dept.members.map((m, j) => h('span', { key: j, className: 'bg-gray-100 text-gray-800 text-xs px-3 py-1 rounded-full font-medium' }, typeof m === 'object' ? m.name : m))
                  )
                )
              ))
            )
          );
        }

        case 'CabinetArchive': {
          const pastChairs = section.pastChairs || [];
          const cabinets = section.cabinets || [];
          return h('div', { key, className: 'space-y-6 mb-6' },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900' }, section.title),
            pastChairs.length > 0 && h('div', { className: 'bg-white border p-6 rounded-2xl' },
              h('h4', { className: 'text-lg font-bold text-gray-900 mb-3' }, 'Past Chairs'),
              h('div', { className: 'grid grid-cols-2 md:grid-cols-3 gap-3' },
                pastChairs.map((pc, i) => h('div', { key: i, className: 'p-3 bg-gray-50 rounded-lg border border-gray-100 text-sm' },
                  h('div', { className: 'font-semibold text-gray-900' }, pc.name),
                  h('div', { className: 'text-xs text-gray-500' }, pc.period)
                ))
              )
            ),
            cabinets.length > 0 && h('div', { className: 'space-y-4' },
              cabinets.map((cab, i) => {
                const cabImg = getImageUrl(getAsset, cab.image);
                return h('div', { key: i, className: 'bg-white border p-6 rounded-2xl space-y-3' },
                  h('div', { className: 'flex justify-between items-center border-b pb-2' },
                    h('h4', { className: 'text-lg font-bold text-gray-900' }, 'Kabinet ', cab.period),
                    cab.chair && h('span', { className: 'text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-semibold' }, 'Ketua: ', cab.chair)
                  ),
                  cabImg && h('img', { src: cabImg, className: 'w-full max-h-64 object-cover rounded-xl my-2' }),
                  cab.vice && h('p', { className: 'text-sm text-gray-600' }, h('strong', null, 'Wakil: '), cab.vice)
                );
              })
            )
          );
        }

        case 'LpjList': {
          const items = section.items || [];
          return h('div', { key, className: 'bg-white border p-6 rounded-2xl space-y-4 mb-6' },
            h('h3', { className: 'text-2xl font-bold text-gray-900' }, 'Arsip LPJ'),
            h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
              items.map((item, i) => h('div', { key: i, className: 'p-4 border rounded-xl bg-gray-50 flex justify-between items-center' },
                h('span', { className: 'font-bold text-gray-900' }, 'LPJ Tahun ', item.year),
                item.url && h('a', { href: item.url, target: '_blank', className: 'text-xs font-semibold bg-blue-600 text-white px-3 py-1.5 rounded-lg' }, 'Buka PDF ↗')
              ))
            )
          );
        }

        case 'CommunitySpotlight': {
          const comm = section.community || {};
          const img = getImageUrl(getAsset, comm.image);
          return h('div', { key, className: 'bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-8 rounded-2xl shadow-lg space-y-4 mb-6' },
            section.title && h('h3', { className: 'text-xs uppercase font-bold tracking-wider text-blue-300' }, section.title),
            h('div', { className: 'flex flex-col md:flex-row gap-6 items-center' },
              img && h('img', { src: img, className: 'w-32 h-32 rounded-full object-cover border-4 border-white/20' }),
              h('div', { className: 'space-y-2 text-center md:text-left' },
                h('h4', { className: 'text-2xl font-bold' }, comm.name),
                comm.category && h('span', { className: 'inline-block bg-blue-800 text-blue-200 text-xs px-2.5 py-0.5 rounded-full font-semibold' }, comm.category),
                comm.description && h('p', { className: 'text-sm text-blue-100 max-w-xl' }, comm.description)
              )
            )
          );
        }

        case 'CommunityGrid': {
          const comms = section.communities || [];
          return h('div', { key, className: 'space-y-6 mb-6' },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900' }, section.title),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
              comms.map((c, i) => {
                const img = getImageUrl(getAsset, c.image);
                return h('div', { key: i, className: 'bg-white border rounded-2xl p-5 shadow-sm space-y-3' },
                  img && h('img', { src: img, className: 'h-40 w-full object-cover rounded-xl' }),
                  h('div', { className: 'flex justify-between items-start' },
                    h('h4', { className: 'text-lg font-bold text-gray-900' }, c.name),
                    c.category && h('span', { className: 'bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded font-medium' }, c.category)
                  ),
                  c.description && h('p', { className: 'text-sm text-gray-600 line-clamp-3' }, c.description)
                );
              })
            )
          );
        }

        case 'ContactList': {
          const contacts = section.contacts || [];
          return h('div', { key, className: 'space-y-6 mb-6' },
            section.title && h('h3', { className: 'text-2xl font-bold text-gray-900' }, section.title),
            (section.officeName || section.officeAddress) && h('div', { className: 'bg-blue-50 border border-blue-200 p-5 rounded-2xl text-sm text-blue-900' },
              section.officeName && h('strong', { className: 'block font-bold text-base' }, section.officeName),
              section.officeAddress && h('p', { className: 'mt-1' }, section.officeAddress)
            ),
            h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              contacts.map((cnt, i) => {
                const img = getImageUrl(getAsset, cnt.image);
                return h('div', { key: i, className: 'bg-white border p-5 rounded-2xl flex gap-4 items-center shadow-sm' },
                  img ? h('img', { src: img, className: 'w-16 h-16 rounded-full object-cover' }) : h('div', { className: 'w-16 h-16 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xl' }, cnt.role ? cnt.role[0] : 'C'),
                  h('div', { className: 'space-y-1 text-sm' },
                    h('div', { className: 'font-bold text-gray-900' }, cnt.role),
                    cnt.email && h('div', { className: 'text-xs text-blue-600' }, '✉ ', cnt.email),
                    cnt.whatsapp && h('div', { className: 'text-xs text-emerald-600' }, '💬 ', cnt.whatsapp)
                  )
                );
              })
            )
          );
        }

        case 'PressKitHeader': {
          return h('div', { key, className: 'bg-white border p-8 rounded-2xl text-center space-y-4 shadow-sm mb-6' },
            section.title && h('h2', { className: 'text-3xl font-bold text-gray-900' }, section.title),
            section.subtitle && h('p', { className: 'text-gray-600 max-w-xl mx-auto' }, section.subtitle),
            section.downloadLink && h('a', { href: section.downloadLink, target: '_blank', className: 'inline-block bg-blue-600 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow-sm' }, section.downloadText || 'Download Press Kit')
          );
        }

        case 'LogoGrid': {
          const logos = section.logos || [];
          return h('div', { key, className: 'space-y-4 mb-6' },
            h('h3', { className: 'text-2xl font-bold text-gray-900' }, 'Logos'),
            h('div', { className: 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4' },
              logos.map((lg, i) => {
                const img = getImageUrl(getAsset, lg.image);
                return h('div', { key: i, className: 'bg-white border p-4 rounded-xl text-center shadow-sm space-y-2' },
                  img && h('img', { src: img, className: 'h-16 mx-auto object-contain' }),
                  lg.name && h('p', { className: 'text-xs font-semibold text-gray-700' }, lg.name)
                );
              })
            )
          );
        }

        case 'IframeSection': {
          return h('div', { key, className: 'bg-white border p-6 rounded-2xl space-y-3 text-center mb-6' },
            section.title && h('h3', { className: 'text-xl font-bold text-gray-900' }, section.title),
            h('div', { className: 'p-6 bg-slate-50 border border-dashed border-slate-300 rounded-xl text-xs text-slate-500' },
              'Embedded Iframe (', section.src || 'No URL set', ')'
            )
          );
        }

        default:
          return h('div', { key, className: 'bg-white border border-gray-200 p-6 rounded-2xl shadow-sm space-y-2 mb-6' },
            h('div', { className: 'text-xs font-bold text-blue-600 uppercase tracking-wider' }, type || 'Generic Section'),
            section.title && h('h3', { className: 'text-xl font-bold text-gray-900' }, section.title),
            section.content && renderText(section.content)
          );
      }
    }

    function PagePreview(props) {
      const { entry, getAsset } = props;
      const data = entry.getIn(['data']) ? entry.getIn(['data']).toJS() : {};
      const sections = data.sections || [];

      return h('div', { className: 'p-6 bg-slate-50 min-h-screen font-sans text-gray-800' },
        h('div', { className: 'max-w-4xl mx-auto space-y-4' },
          h('header', { className: 'border-b pb-4 mb-6 flex justify-between items-center' },
            h('div', null,
              h('h1', { className: 'text-xl font-bold text-gray-900' }, data.title || 'Page Preview'),
              h('p', { className: 'text-xs text-gray-500' }, 'Live Preview Pane')
            ),
            h('span', { className: 'text-xs px-2.5 py-1 rounded bg-blue-100 text-blue-800 font-semibold uppercase' }, data.slug || 'page')
          ),
          sections.map((section, index) => renderSection(section, index, getAsset)),
          sections.length === 0 && h('div', { className: 'p-8 text-center text-gray-500 bg-white rounded-xl shadow-sm border border-gray-200' }, 'No sections added yet.')
        )
      );
    }

    // Register preview templates for Decap CMS collections
    CMS.registerPreviewTemplate("active-pages", PagePreview);
    CMS.registerPreviewTemplate("passive-pages", PagePreview);
  </script>
</body>
</html>
