<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager - PPI Aachen</title>
  <style>
    /* Sembunyikan panel pratinjau bawaan Decap CMS */
    main > div > div > div:nth-child(2) {
      display: none !important;
    }
    main > div > div > div:nth-child(1) {
      width: 100% !important;
      max-width: 100% !important;
      flex: 1 1 100% !important;
    }
  </style>
</head>
<body>
  <!-- Decap CMS JavaScript -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Determine environment based on the hostname
    const hostname = window.location.hostname;
    let branch = 'main';
    let baseUrl = 'https://ppiaachen.de'; // Main production domain
    
    // If we're on a Cloudflare Pages preview deployment
    if (hostname.includes('pages.dev')) {
      branch = 'preview';
      baseUrl = window.location.origin; // e.g. https://liteweb-9sk.pages.dev
    }

    // Initialize Decap CMS, injecting the dynamic backend config
    CMS.init({
      config: {
        backend: {
          branch: branch,
          base_url: baseUrl
        }
      }
    });

    // Nonaktifkan template pratinjau untuk pages
    CMS.registerPreviewTemplate("pages", () => null);
  </script>
</body>
</html>
